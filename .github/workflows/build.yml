name: Build Muguet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run build script
        run: echo "2" | /bin/bash build.sh
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muguet-build
          path: /tmp/muguet
