name: Build Muguet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run build script
        run: /bin/bash build.sh
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: muguet-build
          path: |
            /tmp/muguet
